[package]
name = "horizon-dh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "horizon-preload-regions"
path = "src/bin/preload_regions.rs"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-world = { path = "../horizon-world" }
horizon-client-render = { path = "../horizon-client-render" }
horizon-client = { path = "../horizon-client" }
memmap2 = "0.9.11"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
rayon = "1.10"
fastnbt = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
walkdir = "2.5.0"
log = "0.4"

[dev-dependencies]
tempfile = "3.17"
