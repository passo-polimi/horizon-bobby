[package]
name = "horizon-mod-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Compatibility and integration API for Minecraft Java mod porting in Horizon"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-protocol = { path = "../horizon-protocol" }
horizon-client-render = { path = "../horizon-client-render" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
log = "0.4"
wgpu = { version = "30.0.1", default-features = false }

